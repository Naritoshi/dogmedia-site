<style>
/* 4コマ漫画用スタイル */
.manga-container {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  max-width: 600px;
  margin: 20px auto;
  padding: 15px;
  background: #fff;
  border: 4px solid #000;
}

@media (min-width: 768px) {
  .manga-container {
    grid-template-columns: 1fr 1fr; /* PCでは田の字 */
  }
}

.manga-frame {
  position: relative;
  border: 2px solid #000;
  padding: 10px;
  background: #fff;
  display: flex;
  flex-direction: column;
}

.frame-number {
  position: absolute;
  top: 0;
  left: 0;
  background: #000;
  color: #fff;
  padding: 2px 8px;
  font-weight: bold;
  font-size: 1.2rem;
  z-index: 10;
}

.frame-image {
  flex-grow: 1;
  border: 1px solid #ddd;
  margin-bottom: 10px;
  overflow: hidden;
  min-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.frame-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.ai-scene-placeholder {
  padding: 20px;
  text-align: center;
  font-size: 0.9rem;
  color: #666;
  background: #f9f9f9;
  border: 1px dashed #aaa;
  font-style: italic;
}

.frame-dialogue {
  background: #f0f0f0;
  border-radius: 15px;
  padding: 10px;
  text-align: center;
  font-weight: bold;
  border: 2px solid #000;
  position: relative;
}

/* 吹き出しのしっぽ（オプション） */
.frame-dialogue:after {
  content: '';
  position: absolute;
  top: -10px;
  left: 50%;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-bottom: 10px solid #000;
  margin-left: -10px;
}
</style>
